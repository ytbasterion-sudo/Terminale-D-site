<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminale D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F3EF; --bg-2:#EAE8E2; --ink:#0E0E10; --ink-2:#5A5C61; --line:#D5D3CC; --focus:#3346D3;
  --good:#2C7A4B; --bad:#C2362B;
  --ses:#3346D3; --hggsp:#2F6B45; --hg:#16708A; --philo:#C98A0E; --philo-t:#8F5E00; --es:#5E7185; --ang:#7A4FD0; --droit:#3A3A3E;
  --grotesk:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gut:clamp(16px,4vw,56px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F11; --bg-2:#18181B; --ink:#F1EFEA; --ink-2:#A1A3A8; --line:#2B2B30; --focus:#8C98FF;
    --good:#62C58B; --bad:#FF6B5E;
    --ses:#7F8CFF; --hggsp:#6DBB8A; --hg:#5CB8D1; --philo:#F0B947; --philo-t:#F0B947; --es:#9DB0C3; --ang:#B195FF; --droit:#A7A7AD; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F11; --bg-2:#18181B; --ink:#F1EFEA; --ink-2:#A1A3A8; --line:#2B2B30; --focus:#8C98FF;
  --good:#62C58B; --bad:#FF6B5E;
  --ses:#7F8CFF; --hggsp:#6DBB8A; --hg:#5CB8D1; --philo:#F0B947; --philo-t:#F0B947; --es:#9DB0C3; --ang:#B195FF; --droit:#A7A7AD; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
#view{display:block;overflow-x:clip;outline:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.g{padding-inline:var(--gut)}
.max{max-width:1440px;margin-inline:auto}
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.serif-t{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(44px,5.8vw,92px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.serif-t em{font-style:italic}
.wide-t{margin:0;font-family:var(--grotesk);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.84;letter-spacing:-.045em}
.wide-t em{font-family:var(--serif);font-style:italic;font-weight:300;text-transform:none;letter-spacing:-.02em}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:14px 20px;font-family:var(--grotesk);font-weight:600;font-size:14.5px;transition:gap .3s ease;text-decoration:none}
.btn:hover{gap:20px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.xl{padding:22px 28px;font-size:17px}

/* ---------- Navigation ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:58px}
.brand{font-family:var(--grotesk);font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.02em;text-transform:uppercase;text-decoration:none;white-space:nowrap;flex:none}
.brand em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;color:var(--ses);font-size:1.15em}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.links::-webkit-scrollbar{display:none}
.links a{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 10px;font-family:var(--grotesk);font-weight:500;font-size:14px;text-decoration:none;color:var(--ink-2);position:relative;white-space:nowrap}
.links a::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--c,var(--ink));transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.links a:hover{color:var(--ink)}
.links a[aria-current="page"]{color:var(--ink)}
.links a[aria-current="page"]::after,.links a:hover::after{transform:scaleX(1)}
.nav .drive{flex:none;padding:9px 14px;font-size:13.5px}
#curtain{position:fixed;inset:0;z-index:100;background:var(--c,var(--ink));transform:scaleY(0);pointer-events:none;display:grid;place-items:center}
#curtain span{font-family:var(--grotesk);font-weight:800;font-stretch:125%;text-transform:uppercase;font-size:clamp(40px,9vw,140px);letter-spacing:-.04em;color:var(--bg);opacity:0}

/* ---------- Accueil : couverture ---------- */
.cover{position:relative;min-height:calc(min(86vh,900px) - 58px);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);padding-block:18px 28px;isolation:isolate;overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.issue{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:10px}
.mast{align-self:center;min-width:0;font-size:clamp(58px,13.2vw,212px);will-change:transform}
.mast .l{display:inline-block}
.mast em{font-size:1.12em;color:var(--ses);margin-left:.04em;display:inline-block}
.cover-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px 40px;align-items:end}
.cover-foot p{margin:0;max-width:40ch;font-size:clamp(19px,1.6vw,23px);line-height:1.4}
.scrollhint{display:flex;align-items:center;gap:10px}
.scrollhint i{width:1px;height:38px;background:var(--ink);transform-origin:top;animation:hint 1.8s cubic-bezier(.7,0,.2,1) infinite}
@keyframes hint{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Manifeste */
.manifest{padding-block:120px 100px}
.manifest p{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.2vw,64px);line-height:1.12;letter-spacing:-.018em;max-width:22ch}
.manifest .w{opacity:.2;transition:opacity .2s}
.manifest em{font-style:italic}

/* Drive */
.drive-sec{border-top:1px solid var(--ink);padding-block:90px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px clamp(28px,5vw,90px);align-items:start;min-height:100vh}
.drive-sec h2{font-size:clamp(56px,8vw,132px)}
.drive-sec .lead{font-size:clamp(19px,1.5vw,22px);max-width:36ch;margin:26px 0 30px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:40px;border-top:1px solid var(--ink)}
.stat{padding:18px 0 14px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:16px}
.stat:nth-child(even){padding-left:18px}
.stat b{display:block;font-family:var(--grotesk);font-weight:200;font-stretch:62%;font-size:clamp(64px,7vw,110px);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tree{position:relative;padding-left:34px;font-family:var(--grotesk)}
.tree .root{display:flex;align-items:center;gap:14px;font-weight:700;font-stretch:112%;font-size:clamp(22px,2.2vw,30px);margin:0 0 10px -34px;text-decoration:none}
.tree .root svg,.tree .row svg.fold{width:28px;height:24px;flex:none}
.trunk{position:absolute;left:13px;top:40px;bottom:26px;width:1.5px;background:var(--ink);transform-origin:top}
.tree .row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 12px 14px 22px;text-decoration:none;border-bottom:1px solid var(--line);transition:background .3s,padding .35s cubic-bezier(.2,.7,.2,1)}
.tree .row:hover{background:var(--bg-2);padding-left:30px}
.tree .row .br{position:absolute;left:-21px;top:50%;width:34px;height:1.5px;background:var(--ink);transform-origin:left}
.tree .row .nm{font-weight:600;font-size:clamp(17px,1.5vw,20px);display:flex;gap:10px;align-items:center;min-width:0}
.tree .row .ct{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.tree .row.sub .nm{font-weight:500;color:var(--ink-2)}
.fold path{fill:var(--c,var(--ink))}

/* Étapes */
.steps{border-top:1px solid var(--ink);padding-block:90px}
.steps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-top:50px;position:relative}
.steps-line{position:absolute;left:0;right:0;top:0;height:2px;background:var(--line)}
.steps-line i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.step{padding-top:28px}
.step .n{font-family:var(--grotesk);font-weight:200;font-stretch:62%;font-size:96px;line-height:.8;letter-spacing:-.04em}
.step h3{margin:18px 0 8px;font-family:var(--grotesk);font-weight:700;font-stretch:112%;font-size:22px}
.step p{margin:0;color:var(--ink-2);max-width:32ch}

/* Tuiles matières */
.subjects{border-top:1px solid var(--ink);padding-block:90px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:44px}
.tile{position:relative;min-height:460px;background:var(--bg-2);text-decoration:none;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:20px;isolation:isolate}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .6s}
.tile:hover canvas{opacity:.9}
.tile .head{background:color-mix(in srgb,var(--bg-2) 86%,transparent);margin:-8px;padding:8px}
.tile:hover canvas{transform:scale(1.06)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c);transform:scaleX(.25);transform-origin:left;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.tile:hover::after,.tile:focus-visible::after{transform:scaleX(1)}
.tile h3{margin:0;font-family:var(--grotesk);font-weight:800;font-stretch:125%;text-transform:uppercase;font-size:clamp(28px,2.6vw,42px);line-height:.9;letter-spacing:-.04em}
.tile .foot{display:flex;justify-content:space-between;align-items:end;gap:10px;background:color-mix(in srgb,var(--bg-2) 82%,transparent);margin:-8px;padding:8px}
.tiles-small{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.tile-s{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border:1px solid var(--line);text-decoration:none;transition:border-color .3s,padding .35s}
.tile-s:hover{border-color:var(--ink);padding-left:26px}
.tile-s b{font-family:var(--grotesk);font-weight:700;font-stretch:112%;font-size:19px;display:flex;gap:10px;align-items:center}

/* Parutions */
.paru{border-top:1px solid var(--ink);padding-block:80px 60px;overflow:hidden}
.paru-head{display:flex;justify-content:space-between;align-items:end;gap:14px 30px;flex-wrap:wrap;margin-bottom:34px}
.big-t{font-size:clamp(44px,9vw,150px);white-space:nowrap;will-change:transform}
.track{display:flex;gap:18px;width:max-content;padding-inline:var(--gut);will-change:transform}
.card{width:min(340px,78vw);min-height:340px;background:var(--bg-2);padding:22px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;position:relative;overflow:hidden;flex:none}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c);transform:scaleX(.18);transform-origin:left;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.card:hover::before,.card:focus-visible::before{transform:scaleX(1)}
.card .day{font-family:var(--grotesk);font-weight:300;font-stretch:62%;font-size:120px;line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card .ct{font-size:21px;line-height:1.28;margin:18px 0 14px;text-wrap:balance}
.card .meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.paru.stack .track{flex-direction:column;width:auto}
.paru.stack .card{width:100%;min-height:0;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-areas:"d t" "d m";gap:8px 16px;align-items:start;padding:20px 18px 18px}
.paru.stack .card > :first-child{grid-area:d}
.paru.stack .card .day{font-size:56px}
.paru.stack .card .ct{grid-area:t;margin:0;font-size:18px;line-height:1.3;text-wrap:pretty}
.paru.stack .card .meta{grid-area:m;justify-content:flex-start;gap:14px;align-self:end}
.paru.stack:not(.all) .card:nth-child(n+7){display:none}
.paru-more{display:none}
.paru.stack:not(.all) .paru-more{display:block;padding-top:16px}
.paru-more .btn{width:100%;justify-content:space-between}

/* ---------- Page matière ---------- */
.shero{position:relative;padding-block:40px 34px;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--ink)}
.shero .band{position:absolute;left:0;right:0;top:0;height:10px;background:var(--c);transform-origin:left}
.shero .top{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-top:18px}
.shero h1{font-size:clamp(76px,17vw,280px);margin-top:36px;color:var(--ink);will-change:transform}
.shero h1 .l{display:inline-block}
.shero .full{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(24px,3vw,44px);line-height:1.1;margin:14px 0 0;color:var(--ct,var(--c));max-width:24ch}
.shero-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end;margin-top:40px}
.nums{display:flex;gap:36px;flex-wrap:wrap}
.nums div b{display:block;font-family:var(--grotesk);font-weight:200;font-stretch:62%;font-size:clamp(56px,6vw,96px);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.dossier{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:40px clamp(28px,5vw,80px);padding-block:70px}
.plate{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);height:min(80vh,740px);background:var(--bg-2);overflow:hidden;margin:0}
.plate canvas{position:absolute;inset:0;width:100%;height:100%}
.plate figcaption{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dtext{display:grid;align-content:start;gap:28px}
.dtitle{font-size:clamp(40px,4.8vw,78px)}
.lead{font-size:clamp(19px,1.5vw,22px);line-height:1.5;margin:0;max-width:44ch}
.quote{margin:8px 0;font-family:var(--grotesk);font-weight:500;font-size:clamp(22px,2.2vw,32px);line-height:1.18;letter-spacing:-.015em;color:var(--ct,var(--c));max-width:24ch;text-wrap:balance}
.quote .qt::before{content:"« ";} .quote .qt::after{content:" »";}
.quote cite{display:block;margin-top:10px;font-family:var(--mono);font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.blk h3{margin:0 0 6px;font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fl{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.fl a{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line);text-decoration:none;position:relative;overflow:hidden;isolation:isolate}
.fl a::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1;opacity:.12}
.fl a:hover::after{transform:scaleX(1)}
.fl .n{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.fl .t{font-size:19px;line-height:1.3}
.fl .go{color:var(--ink-2);transition:transform .3s ease}
.fl a:hover .go{transform:translateX(4px);color:var(--ink)}

.timeline{border-top:1px solid var(--ink);padding-block:70px}
.tl{position:relative;margin-top:40px;padding-left:clamp(28px,4vw,60px)}
.tl-line{position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-line i{position:absolute;inset:0;background:var(--c);transform-origin:top;transform:scaleY(0)}
.tl a{position:relative;display:grid;grid-template-columns:clamp(90px,10vw,150px) minmax(0,1fr) auto;gap:10px 24px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .35s cubic-bezier(.2,.7,.2,1)}
.tl a:hover{padding-left:12px}
.tl a::before{content:"";position:absolute;left:calc(clamp(28px,4vw,60px) * -1 + 1px);top:30px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--c)}
.tl .d{font-family:var(--grotesk);font-weight:300;font-stretch:62%;font-size:clamp(40px,4.4vw,64px);line-height:.8;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tl .d small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:8px;font-stretch:100%}
.tl .t{font-size:clamp(20px,1.8vw,26px);line-height:1.25}
.tl .go{color:var(--ink-2)}

.interro{border-top:1px solid var(--ink);padding-block:70px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:36px clamp(28px,5vw,80px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:9px 12px;font-family:var(--grotesk);font-size:14px;font-weight:500;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.qbox{min-height:440px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--ink);margin-bottom:26px}
.qprog{height:2px;background:var(--line);position:relative;margin-bottom:30px}
.qprog i{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.q{margin:0 0 26px;font-family:var(--serif);font-size:clamp(26px,2.8vw,40px);line-height:1.15;letter-spacing:-.012em;text-wrap:balance}
.opts{display:grid;border-top:1px solid var(--line)}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) 24px;gap:10px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);font-size:19px;line-height:1.35;transition:padding .3s ease,background .3s}
.opt:hover:not([disabled]){padding-left:14px}
.opt:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.opt .l{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.opt .m{font-family:var(--mono);font-size:16px;text-align:right}
.opt.ok{background:color-mix(in srgb,var(--good) 12%,transparent)} .opt.ok .m{color:var(--good)}
.opt.ko{background:color-mix(in srgb,var(--bad) 10%,transparent)} .opt.ko .m{color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{margin:22px 0 0;font-style:italic;color:var(--ink-2);max-width:60ch}
.expl b{font-style:normal;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-right:8px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.score{font-family:var(--grotesk);font-weight:800;font-stretch:125%;font-size:clamp(96px,16vw,220px);line-height:.8;letter-spacing:-.05em;margin:0;font-variant-numeric:tabular-nums}
.score small{font-family:var(--serif);font-weight:300;font-style:italic;font-stretch:100%;font-size:.3em;letter-spacing:0;color:var(--ink-2)}
.pips{display:flex;gap:4px;margin-top:22px}
.pips i{flex:1;max-width:44px;height:4px;background:var(--line)}
.pips i.y{background:var(--good)} .pips i.n{background:var(--bad)}

.next{display:block;border-top:1px solid var(--ink);padding-block:60px 70px;text-decoration:none;overflow:hidden}
.next .wide-t{font-size:clamp(56px,12vw,200px);transition:transform .7s cubic-bezier(.2,.7,.2,1);display:inline-block}
.next:hover .wide-t{transform:translateX(3%)}
.empty{padding-block:70px;border-top:1px solid var(--ink)}
.empty p{font-size:clamp(22px,2.4vw,34px);line-height:1.25;max-width:30ch;margin:0 0 28px}

/* ---------- Séance ---------- */
.seance{padding-block:60px 80px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:36px clamp(28px,5vw,80px);align-items:start}
.clock{font-family:var(--grotesk);font-weight:200;font-stretch:62%;font-size:clamp(120px,22vw,330px);line-height:.78;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:24px 0 10px}
.ribbon{height:3px;background:var(--line);position:relative;margin:14px 0 24px}
.ribbon i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c,var(--ink))}
.ctrls{display:flex;gap:18px;flex-wrap:wrap;align-items:end;margin-top:26px}
.f{display:grid;gap:6px}
.f > span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
select{font:inherit;font-family:var(--grotesk);font-size:16px;background:var(--bg);color:var(--ink);border:0;border-bottom:1px solid var(--ink);padding:8px 26px 8px 0;border-radius:0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:right 8px center,right 3px center;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:inline-flex;box-shadow:inset 0 0 0 1px var(--ink)}
.seg button{all:unset;cursor:pointer;padding:10px 14px;font-family:var(--grotesk);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.log{border-top:1px solid var(--ink)}
.log-row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.log-row .d,.log-row .m{font-family:var(--mono);font-size:13px}
.log-row .d{color:var(--ink-2)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.total b{font-family:var(--grotesk);font-weight:300;font-stretch:62%;font-size:64px;line-height:1}

.colophon{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 30px;padding-block:26px 40px;border-top:1px solid var(--ink)}
.colophon p{margin:0;max-width:60ch;font-size:15px;color:var(--ink-2)}
.colophon nav{display:flex;gap:18px;flex-wrap:wrap}

/* ---------- Menu spécialités ---------- */
.nav-sep{flex:none;width:1px;height:18px;background:var(--line);margin:0 6px;align-self:center}
.spe-btn{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 10px;font-family:var(--grotesk);font-weight:500;font-size:14px;color:var(--ink-2);position:relative;white-space:nowrap}
.spe-btn::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--c,var(--ink));transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.spe-btn:hover,.spe-btn.on,.spe-btn[aria-expanded="true"]{color:var(--ink)}
.spe-btn:hover::after,.spe-btn.on::after{transform:scaleX(1)}
.spe-btn .dot{display:none} .spe-btn.on .dot{display:inline-block}
.spe-btn svg{transition:transform .3s ease}
.spe-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.spe-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.spe-menu{position:absolute;top:calc(100% + 8px);z-index:60;background:var(--bg);border:1px solid var(--ink);padding:18px 18px 16px;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.spe-menu[hidden]{display:none}
.spe-list{display:grid;border-top:1px solid var(--ink);margin-top:12px}
.spe-list a{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--grotesk);font-weight:600;font-size:16px;line-height:1.2;transition:padding .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.spe-list a small{display:block;margin-top:5px;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.spe-list a .go{color:var(--ink-2);transition:transform .3s}
.spe-list a:hover,.spe-list a[aria-current="page"]{padding-left:12px;box-shadow:inset 3px 0 0 var(--c)}
.spe-list a:hover .go{transform:translateX(4px);color:var(--ink)}
.spe-list a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.spe-note{margin:12px 0 0;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.45;color:var(--ink-2)}
.sub-head{display:flex;justify-content:space-between;align-items:end;gap:14px 40px;flex-wrap:wrap}
.sub-head p{margin:0 0 8px;max-width:44ch;font-size:17px;line-height:1.45}
.spe-head{margin-top:90px}
.tiles-3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* ---------- QCM faits ---------- */
.chip.done{color:var(--ink-2);border-style:dashed}
.chip.done[aria-pressed="true"]{color:var(--bg);border-style:solid}
.chip .tick{font-size:12px;color:var(--good);width:9px;text-align:center}
.chip.done[aria-pressed="true"] .tick{color:var(--bg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qcount{margin:14px 0 0}
.qdone-box{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.btn.fin{background:var(--good);box-shadow:none;color:var(--bg)}
.btn.fin span{font-size:15px}
.qdone-ok{margin:0;font-family:var(--grotesk);font-weight:600;font-size:18px;color:var(--good)}
.chip.revoir{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.chip.revoir .tick{color:var(--bad)}
.chip.revoir[aria-pressed="true"] .tick{color:var(--bg)}
.qdone-ko{margin:0;font-family:var(--grotesk);font-weight:600;font-size:18px;color:var(--bad)}
.fl a.qrevoir .t::after{content:"QCM à revoir ↺";margin-left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);white-space:nowrap}
.fl a.qdone .t::after{content:"QCM fait ✓";margin-left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);white-space:nowrap}
/* ---------- Répétition espacée ---------- */
.chip.reviser{border-color:color-mix(in srgb,var(--philo) 70%,transparent)}
.chip.reviser .tick{color:var(--philo-t)}
.chip.reviser[aria-pressed="true"] .tick{color:var(--bg)}
.fl a.qreviser .t::after{content:"QCM à réviser ↻";margin-left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--philo-t);white-space:nowrap}
.due-strip{border:1px solid var(--ink);padding:18px 20px;margin:0 0 60px;background:var(--bg)}
.due-strip > .k{margin:0 0 12px}
.due-list{display:flex;flex-wrap:wrap;gap:8px}
.due{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);text-decoration:none;font-family:var(--grotesk);font-weight:500;font-size:15px;transition:border-color .25s,padding .3s}
.due:hover{border-color:var(--ink);padding-left:18px}
.due.revoir .k{color:var(--bad)} .due.reviser .k{color:var(--philo-t)}
/* ---------- Lexique ---------- */
.lx{padding-block:40px 90px}
.lx-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--bg);padding:16px 0 14px;border-bottom:1px solid var(--ink)}
.lx-search{display:flex;align-items:center;gap:14px;color:var(--ink-2)}
.lx-search input{flex:1;min-width:0;font:inherit;font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.4vw,44px);letter-spacing:-.01em;background:transparent;color:var(--ink);border:0;padding:4px 0;border-radius:0;outline:none}
.lx-search input::placeholder{color:color-mix(in srgb,var(--ink-2) 70%,transparent);font-style:italic}
.lx-search:focus-within{color:var(--ink)}
.lx-search input::-webkit-search-cancel-button{cursor:pointer}
.lx-filt{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lx-filt .chip{padding:7px 11px;font-size:13.5px}
.lx-filt .chip[aria-pressed="true"] .muted{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.lx-count{margin:10px 0 0}
.lx-group{display:grid;grid-template-columns:clamp(60px,9vw,140px) minmax(0,1fr);gap:0 clamp(16px,3vw,40px);border-bottom:1px solid var(--line);padding-top:26px}
.lx-group.flat{grid-template-columns:minmax(0,1fr)}
.lx-letter{font-family:var(--grotesk);font-weight:800;font-stretch:125%;font-size:clamp(48px,7vw,104px);line-height:.8;letter-spacing:-.04em;position:sticky;top:calc(env(safe-area-inset-top,0px) + 250px);align-self:start;padding-bottom:20px}
.lx-dl{margin:0}
.lx-item{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:8px 30px;padding:18px 0 20px;border-top:1px solid var(--line)}
.lx-item:first-child{border-top:0;padding-top:4px}
.lx-item dt{font-family:var(--grotesk);font-weight:700;font-stretch:108%;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.lx-item dd{margin:0}
.lx-def{margin:0;font-size:18px;line-height:1.5;max-width:62ch}
.lx-note{margin:8px 0 0;font-style:italic;font-size:15px;color:var(--ink-2);padding-left:12px;border-left:2px solid var(--philo)}
.lx-src{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lx-src .dot{width:7px;height:7px}
.lx-src a{color:var(--ink);text-underline-offset:3px}
.lx mark{background:color-mix(in srgb,var(--c,var(--ses)) 22%,transparent);color:inherit;padding:0 1px}
.lx-empty{font-size:clamp(20px,2.2vw,28px);max-width:34ch;padding:40px 0}
.lx-foot{margin:30px 0 0;max-width:70ch;font-size:15px}
@media (max-width:900px){ .lx-item{grid-template-columns:1fr} .lx-letter{position:static} }
@media (max-width:560px){ .lx-group{grid-template-columns:1fr} .lx-letter{font-size:44px;padding:0 0 6px} .lx-bar{padding:10px 0} .lx-search input{font-size:24px} .lx-filt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)} .lx-filt::-webkit-scrollbar{display:none} .lx-filt .chip{flex:none} .lx-count{margin-top:8px} .due-strip{padding:14px} }
/* ---------- Barre d'onglets mobile ---------- */
.tabbar,.sheet-wrap{display:none}
@media (min-width:1024px) and (max-width:1180px){
  .links{gap:0} .links a,.spe-btn{padding:8px 7px;font-size:13.5px} .nav-sep{margin:0 3px}
  .nav .drive span{display:none} .nav-in{gap:12px}
}
@media (max-width:1023px){
  .links,.spe-menu{display:none!important}
  .nav-in{justify-content:space-between}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:60;padding-inline:max(0px,calc((100vw - 640px) / 2));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;color:var(--ink-2);text-decoration:none;-webkit-tap-highlight-color:transparent}
  .tab span{font-family:var(--grotesk);font-size:11px;font-weight:500;letter-spacing:0;white-space:nowrap}
  .tab::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--c,var(--ink));transform:scaleX(0);transition:transform .35s cubic-bezier(.7,0,.2,1)}
  .tab[aria-current="page"]{color:var(--ink)}
  .tab[aria-current="page"]::before{transform:scaleX(1)}
  .tab:active{background:var(--bg-2)}
  .tab:focus-visible{outline:2px solid var(--focus);outline-offset:-4px}
  .sheet-wrap{display:block;position:fixed;inset:0;z-index:90}
  .sheet-wrap[hidden]{display:none}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.42)}
  .sheet{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:640px;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-top:1px solid var(--ink);padding:0 var(--gut) calc(22px + env(safe-area-inset-bottom,0px));outline:none}
  .sheet-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;background:var(--bg);z-index:1}
  .sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .sheet-x{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;font-size:18px;margin-right:-10px}
  .sheet-x:focus-visible{outline:2px solid var(--focus)}
  .sheet-g{margin:18px 0 0}
  .sheet .spe-list{margin-top:8px}
  .sheet .spe-list a{padding:15px 4px}
  .sheet-drive{margin-top:22px;width:100%;justify-content:space-between}
  html.sheet-open,html.sheet-open body{overflow:hidden}
}
/* ---------- Zones tactiles (audit du 23/09) ---------- */
.wd{display:inline-block;white-space:nowrap}
.tile-s > .k{white-space:nowrap;flex:none}
.brand{padding-block:10px}
.colophon nav a{display:inline-block;padding-block:12px}
.tree .root{min-height:44px}
.lx-src a{display:inline-block;padding-block:7px;margin-block:-7px}
.lx .lx-src{row-gap:14px}
.nb-check{min-height:40px}
details.nb-card > summary{padding-block:8px;margin-block:-8px}
@media (max-width:760px){
  .nav .drive{min-width:44px;min-height:40px;justify-content:center}
  .lx-filt .chip{min-height:40px}
  .lx-filt{mask-image:linear-gradient(90deg,#000 82%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent)}
}
/* ---------- Mes notes ---------- */
.nb{padding-block:40px 90px}
.nb input,.nb textarea{font:inherit;font-family:var(--grotesk);font-size:16px;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--ink);padding:8px 2px;border-radius:0;min-width:0;width:100%}
.nb input:focus-visible,.nb textarea:focus-visible,.nb select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nb select{width:100%}
.nb textarea{min-height:104px;resize:vertical;border:1px solid var(--line);padding:12px;background:var(--bg);font-family:var(--mono);font-size:12.5px;line-height:1.5;word-break:break-all}
.nb textarea:focus{border-color:var(--ink)}
.nb-warn{margin:0 0 24px;padding:14px 16px;border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.nb-card{border:1px solid var(--line);padding:20px 22px;background:var(--bg)}
.nb-card h3{margin:0;font-family:var(--grotesk);font-weight:700;font-stretch:112%;font-size:20px}
details.nb-card > summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;align-items:baseline;list-style:none}
details.nb-card > summary::-webkit-details-marker{display:none}
details.nb-card > summary::after{content:"+";font-family:var(--mono);font-size:18px;line-height:1}
details.nb-card[open] > summary::after{content:"−"}
details.nb-card[open] > summary{margin-bottom:20px}
.nb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 26px}
.nb-opts{display:flex;flex-wrap:wrap;gap:8px}
.nb-check{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 12px;font-family:var(--grotesk);font-size:14px;cursor:pointer}
.nb-check:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.nb .nb-check input{width:auto;accent-color:var(--ink)}
.nb-sec{border-top:1px solid var(--ink);margin-top:70px;padding-top:40px}
.nb-add{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,1fr)) minmax(0,2.2fr) auto;gap:16px 18px;align-items:end;margin-top:30px;padding:20px 22px;background:var(--bg-2)}
.nb-kpis{display:flex;gap:30px 60px;flex-wrap:wrap;margin:36px 0 22px}
.nb-big{font-family:var(--grotesk);font-weight:200;font-stretch:62%;font-size:clamp(64px,8vw,120px);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:8px}
.nb-big small{font-family:var(--serif);font-weight:300;font-style:italic;font-stretch:100%;font-size:.26em;letter-spacing:0;color:var(--ink-2)}
.nb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nb-table{width:100%;border-collapse:collapse;border-top:1px solid var(--ink);font-variant-numeric:tabular-nums}
.nb-table th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.nb-table th:first-child,.nb-table td:first-child{text-align:left;padding-left:0}
.nb-table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:14px}
.nb-table td:first-child{font-family:var(--grotesk);font-size:16px;font-weight:500;min-width:170px}
.nb-table td.avg{font-weight:700;font-size:15px}
.nb-table td.lo{color:var(--bad)} .nb-table td.hi{color:var(--good)}
.nb-table tr:has(+ .nb-det) td{border-bottom:0}
.nb-det td{padding-top:0;text-align:left!important}
.nb-chips{display:flex;flex-wrap:wrap;gap:6px}
.nb-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;background:var(--bg-2);font-family:var(--mono);font-size:12px;color:var(--ink)}
.nb-chip button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.nb-chip button:hover{color:var(--bad)} .nb-chip button:focus-visible{outline:2px solid var(--focus)}
.nb-proj{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:36px clamp(28px,4vw,60px);align-items:start}
.nb-bac{width:100%;border-collapse:collapse;margin-bottom:30px;font-variant-numeric:tabular-nums}
.nb-bac caption{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.nb-bac td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:16px}
.nb-bac td:first-child{padding-left:0}
.nb-bac td.src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nb-bac td.c{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
.nb-bac td.v{width:96px;text-align:right;font-family:var(--mono);font-size:15px}
.nb-bac td.v input{text-align:right;font-family:var(--mono);font-size:15px;width:84px;padding:4px 2px}
.nb-verdict{background:var(--ink);color:var(--bg);padding:28px 28px 30px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.nb-verdict .nb-big small{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.nb-scale{position:relative;height:40px;margin:26px 8px 8px;border-bottom:1px solid var(--bg)}
.nb-scale span{position:absolute;bottom:-22px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;opacity:.7}
.nb-scale i{position:absolute;bottom:0;width:1px;height:8px;background:var(--bg);opacity:.6}
.nb-scale b{position:absolute;bottom:0;width:3px;height:34px;background:var(--ses);transform:translateX(-1px);transition:left .8s cubic-bezier(.2,.7,.2,1)}
.nb-transfer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.nb-qr{margin-top:16px;width:212px;padding:8px;background:#fff}
.nb-qr img,.nb-qr canvas{display:block;width:196px;height:196px}

    $("#nb-count", root).textContent = B.notes.length;

  function renderAll(){ renderGrades(); buildBac(); }

  /* Transfert entre appareils */

  }}, el("span", {}, "Copier mon code"));

    inMsg.append(el("p", {}, `Ce code contient ${data.notes.length} note${data.notes.length > 1 ? "s" : ""} et ${Object.values(data._qcm).filter(v => v.st !== "revoir").length} QCM fait${Object.values(data._qcm).filter(v => v.st !== "revoir").length > 1 ? "s" : ""}, profil ${data.profil.spe1} et ${data.profil.spe2}. Il remplacera ce qui est enregistré sur cet appareil (${B.notes.length} note${B.notes.length > 1 ? "s" : ""}).`),
      el("div", {class:"row-actions", style:"margin-top:12px"},

        el("button", {class:"btn ghost", type:"button", onclick:() => { inMsg.textContent = ""; }}, "Annuler")));
  };
  sec.append(el("section", {class:"nb-sec", "aria-labelledby":"h-tr"},
    el("h2", {class:"serif-t", id:"h-tr", html:"Changer <em>d'appareil</em>"}),
    el("p", {class:"muted", style:"max-width:62ch;margin:14px 0 26px"}, "Tes notes et tes QCM faits sont enregistrés dans ce navigateur uniquement. Pour les retrouver sur ton téléphone ou ton ordinateur, copie ton code ici, envoie-le-toi (message, mail, notes), puis colle-le sur l'autre appareil. Garde aussi ce code comme sauvegarde."),
    el("div", {class:"nb-transfer"},

        el("div", {class:"row-actions", style:"margin-top:12px"}, el("button", {class:"btn", type:"button", onclick:doImport}, "Importer")), inMsg))));

/* ---------- Lexique : notions reprises des fiches (rien d'ajouté) ---------- */
const GEN = "Définition générale de géographie, à confronter au cours.";
const LEX = [
  /* SES */
  {t:"Structure sociale", m:"ses", s:["01"], d:"Répartition hiérarchisée des individus au sein d'un espace social propre à chaque société."},
  {t:"Stratification sociale", m:"ses", s:["01"], d:"Différenciation sociale fondée sur la distribution inégale des ressources valorisées, au-delà de la simple opposition riches/pauvres."},
  {t:"Classe sociale (Marx)", m:"ses", s:["01","03"], d:"Groupe défini par sa position dans le mode de production (possession ou non des moyens de production) et par une conscience de classe commune. Rapport d'exploitation entre la bourgeoisie, qui détient le capital, et le prolétariat, qui ne possède que sa force de travail."},
  {t:"Classe en soi, classe pour soi", m:"ses", s:["01","03"], d:"La classe en soi partage des conditions matérielles sans nécessairement en avoir conscience. Elle devient classe pour soi quand ses membres prennent conscience de leurs intérêts communs et s'organisent (syndicats, partis). Condition de la lutte des classes."},
  {t:"Lutte des classes", m:"ses", s:["01"], d:"Confrontation entre bourgeoisie et prolétariat, moteur du changement social selon Marx."},
  {t:"Groupe de statut (Weber)", m:"ses", s:["01","03"], d:"Individus partageant le même prestige social (diplôme, profession, naissance, style de vie). L'ordre social est autonome de l'ordre économique : un professeur d'université ou un membre du clergé peut avoir un grand prestige sans grande richesse."},
  {t:"Réalisme et nominalisme (Marx, Weber)", m:"ses", s:["01","03"], d:"Marx a une analyse unidimensionnelle et réaliste : il ne retient que le critère économique, les classes existant objectivement. Weber a une analyse multidimensionnelle et nominaliste : il distingue trois ordres indépendants, économique (classes), social (statuts) et politique (partis) ; pour lui les classes sont des catégories construites par le sociologue, pas des groupes qui existent en soi."},
  {t:"Distance interclasses", m:"ses", s:["01","03"], d:"Écart statistique et culturel entre classes sociales différentes."},
  {t:"Distance intra-classe", m:"ses", s:["01","03"], d:"Écart de conditions de vie, de revenus et de comportements au sein d'une même classe. Sa hausse fragilise l'homogénéité d'une classe."},
  {t:"Moyennisation", m:"ses", s:["01","03"], d:"Constitution d'une vaste classe moyenne aux modes de vie uniformisés, qui réduit la distance interclasses. Théorie d'Henri Mendras : une société en toupie plutôt qu'en pyramide."},
  {t:"Individualisation", m:"ses", s:["01","03"], d:"Détachement de l'individu de ses appartenances collectives, via la personnalisation du travail (rémunération au mérite, entretiens individuels) et le numérique (travail en ligne, évaluation par les clients), qui affaiblit la conscience de classe."},
  {t:"Capitaux (Bourdieu)", m:"ses", s:["01"], d:"Capital économique (patrimoine, revenus), capital culturel (diplômes, biens et dispositions culturelles) et capital social (réseau de relations mobilisable), dont la dotation globale détermine la position sociale d'un individu."},
  {t:"Rapports sociaux de genre", m:"ses", s:["01","03"], d:"Hiérarchisation entre hommes et femmes, qui s'articule avec les rapports de classe sans les remplacer."},
  {t:"Catégorie socioprofessionnelle (PCS)", m:"ses", s:["02"], d:"Catégorie statistique créée par l'Insee en 1954, selon le statut d'emploi, la qualification et le secteur d'activité. Huit catégories au niveau agrégé : six actives (agriculteurs exploitants, artisans-commerçants-chefs d'entreprise, cadres et professions intellectuelles supérieures, professions intermédiaires, employés, ouvriers) et deux inactives (retraités, autres sans activité professionnelle)."},
  {t:"Revenu", m:"ses", s:["02"], d:"Somme dépensable sans réduire le patrimoine. Trois types primaires : revenu du travail (salaire), du capital (loyer, dividende, intérêt) et mixte (indépendant). S'y ajoutent les revenus de transfert (chômage, retraite, minima sociaux). Le revenu disponible est ce qui reste après prélèvements obligatoires."},
  {t:"Patrimoine", m:"ses", s:["02"], d:"Stock d'actifs détenus à un instant donné. Les inégalités de patrimoine sont plus fortes que celles de revenu, car les hauts revenus peuvent épargner et accumuler du patrimoine."},
  {t:"Déciles", m:"ses", s:["02"], d:"Outils de classement des revenus ou patrimoines, du plus pauvre au plus riche, de D1 à D9."},
  {t:"Écart interdéciles", m:"ses", s:["02"], d:"D9 moins D1 : mesure absolue, en euros."},
  {t:"Rapport interdéciles", m:"ses", s:["02"], d:"D9 sur D1 : mesure relative, sous forme de coefficient."},
  {t:"Courbe de Lorenz, indice de Gini", m:"ses", s:["02"], d:"Représentent la concentration des revenus ou du patrimoine par comparaison à une égalité parfaite (la droite d'équirépartition) ; l'indice de Gini résume cet écart en un seul chiffre."},
  {t:"Capital humain", m:"ses", s:["02"], d:"Connaissances et compétences d'un individu, déterminées en partie par le diplôme, et corrélées à la PCS et au revenu."},
  {t:"Ménage", m:"ses", s:["02"], d:"Occupants d'une résidence, avec ou sans lien de parenté, partageant un budget commun."},
  {t:"Cycle de vie", m:"ses", s:["02"], d:"Étapes de la vie (célibat, couple, famille, veuvage) et modes de vie qui y sont associés."},

  {t:"Salarisation, tertiarisation, féminisation, massification scolaire", m:"ses", s:["02"], d:"Quatre évolutions distinctes de la population active depuis 1950 : hausse de la part des salariés, du secteur tertiaire, des femmes dans l'emploi, et du niveau de diplôme."},

  {t:"Exploiter, conserver, préserver", m:"hggsp", s:["01"], d:"Trois logiques face à l'environnement. Exploiter, c'est prélever une ressource pour produire des richesses (risque de surexploitation). Conserver, c'est protéger en continuant d'utiliser, par une gestion raisonnée (exemple : l'agriculture biologique). Préserver, c'est protéger la nature pour elle-même (sanctuarisation)."},

  {t:"Delta", m:"hg", s:["02"], d:"Embouchure divisée en plusieurs bras, où les sédiments se déposent et progressent sur la mer, souvent en forme de triangle."},
  {t:"Circumterrestre", m:"hg", s:["02"], d:"Qualifie une route maritime qui fait le tour complet de la Terre en reliant les grands bassins de circulation mondiale."},
  {t:"Dorsales océaniques", m:"hg", s:["02"], d:"Chaînes de montagnes sous-marines formées par l'écartement des plaques tectoniques."},
  {t:"Nodules polymétalliques", m:"hg", s:["02"], d:"Roches posées sur les fonds océaniques, riches en métaux convoités (manganèse, nickel, cobalt, cuivre)."},
  {t:"Littoralisation", m:"hg", s:["02"], d:"Concentration progressive des populations, des grandes villes et des activités économiques sur les côtes."},
  {t:"Héliotropisme", m:"hg", s:["02"], d:"Attraction des régions ensoleillées sur l'installation des populations, des retraités et des entreprises."},
  {t:"ZEE (zone économique exclusive)", m:"hg", s:["02"], d:"Espace maritime qui s'étend jusqu'à 200 milles marins (environ 370 km) des côtes, où l'État côtier est seul à pouvoir exploiter les ressources. Définie par la convention de Montego Bay (1982). À ne pas confondre avec les eaux territoriales (12 milles, pleine souveraineté de l'État)."},

  /* Philosophie */
  {t:"Hédonisme", m:"philo", s:["01"], d:"Théorie du bonheur fondée sur le calcul rationnel des plaisirs et de leurs conséquences. Agir bien revient à maximiser le plaisir et minimiser la souffrance."},
  {t:"Épicurisme populaire (carpe diem)", m:"philo", s:["01"], d:"Philosophie de l'excès selon laquelle tout ce qui est bon mériterait d'être abusé. C'est une déformation de la pensée d'Épicure, pas sa continuation fidèle."},
  {t:"Épicurisme antique", m:"philo", s:["01"], d:"Doctrine d'Épicure qui vise l'ataraxie par des plaisirs simples et la modération des désirs, en évitant les désirs superflus."},
  {t:"Ataraxie", m:"philo", s:["01"], d:"Absence de trouble de l'âme, état recherché par les épicuriens."},
  {t:"Euthymie", m:"philo", s:["02"], d:"Heureuse disposition de l'âme, obtenue selon Démocrite par la modération du plaisir, non par sa quantité."},
  {t:"Comparaison descendante et ascendante", m:"philo", s:["02"], d:"Méthode de Démocrite pour être heureux : se comparer aux plus malheureux (comparaison descendante) plutôt qu'aux plus riches (comparaison ascendante, source d'envie et de désir sans fin)."},
  {t:"Perfection première et perfection dernière", m:"philo", s:["03"], d:"Chez Maïmonide, les deux degrés de l'accomplissement humain : la perfection première, la santé du corps, et la perfection dernière, la raison en acte, la plus noble."},
  {t:"Miracle absolu et miracle relatif", m:"philo", s:["03"], d:"Chez Wittgenstein, le miracle relatif est un fait extraordinaire seulement provisoirement inexpliqué par la science ; le miracle absolu, hors de portée par principe de toute explication scientifique, ne se rencontre jamais dans les faits."}
];

/* ---------- Vue : lexique ---------- */
const norm = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae");
const LEX_M = ["ses","hggsp","hg","philo"];
function viewLexique(root){
  const entries = LEX.map(e => ({...e, key:norm(e.t), hay:norm(e.t + " " + e.d + " " + (e.note || ""))}))
    .sort((a, b) => a.key.localeCompare(b.key, "fr"));
  root.append(el("header", {class:"shero g", style:"--c:var(--ink)"}, el("span", {class:"band", "aria-hidden":"true"}),
    el("div", {class:"max"},
      el("div", {class:"top"}, el("span", {class:"k"}, "Outil"), el("span", {class:"k muted"}, entries.length + " notions, toutes tirées des fiches")),
      el("h1", {class:"wide-t"}, "Lexique"),
      el("p", {class:"full", style:"color:var(--ink-2)"}, "Toutes les notions définies dans les fiches de révision, à chercher en un mot."))));

  const sec = el("section", {class:"lx g max"}); root.append(sec);
  const input = el("input", {type:"search", id:"lx-q", placeholder:innerWidth < 520 ? "Cherche une notion…" : "Cherche une notion : ataraxie, ZEE, Gini…", autocomplete:"off", spellcheck:"false", "aria-label":"Chercher une notion", enterkeyhint:"search"});
  const filt = el("div", {class:"lx-filt", role:"group", "aria-label":"Filtrer par matière"});
  const count = el("p", {class:"k muted lx-count", "aria-live":"polite"});
  const list = el("div", {class:"lx-list"});
  sec.append(el("div", {class:"lx-bar"}, el("label", {class:"lx-search"}, svg('<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.6"/></svg>'), input), filt, count), list,
    el("p", {class:"muted lx-foot"}, "Les définitions sont reprises des fiches, sans ajout. Celles marquées d'une note sont des définitions générales ou à confirmer : en cas de doute, la parole du professeur prime."));

  let mat = "all";
  const renderFilt = () => {
    filt.textContent = "";
    const mk = (k, label, n) => el("button", {type:"button", class:"chip", "aria-pressed":String(mat === k), onclick:() => { mat = k; renderFilt(); render(); }},
      k !== "all" ? el("span", {class:"dot", style:`--c:var(--${k})`}) : null, label, el("span", {class:"muted"}, " " + n));
    filt.append(mk("all", "Toutes", entries.length));
    for (const k of LEX_M) filt.append(mk(k, SUBJ[k].short, entries.filter(e => e.m === k).length));
  };
  /* Surligne les termes cherchés sans toucher au HTML */
  const hl = (text, terms) => {
    if (!terms.length) return [text];
    let n = ""; const pos = [];
    for (let i = 0; i < text.length; i++) for (const ch of norm(text[i])) { n += ch; pos.push(i); }
    const marks = new Array(text.length).fill(false);
    for (const t of terms) { let i = n.indexOf(t); while (i !== -1) { for (let j = i; j < i + t.length; j++) marks[pos[j]] = true; i = n.indexOf(t, i + t.length); } }
    const out = []; let buf = "", on = false;
    for (let i = 0; i < text.length; i++) { if (marks[i] !== on) { if (buf) out.push(on ? el("mark", {}, buf) : buf); buf = ""; on = marks[i]; } buf += text[i]; }
    if (buf) out.push(on ? el("mark", {}, buf) : buf);
    return out;
  };
  const volOf = (m, n) => VOLUMES.find(v => v.m === m && v.n === n);
  const render = () => {
    const terms = norm(input.value.trim()).split(/\s+/).filter(Boolean);
    let res = entries.filter(e => (mat === "all" || e.m === mat) && terms.every(t => e.hay.includes(t)));
    if (terms.length) res.sort((a, b) => (terms.every(t => b.key.includes(t)) - terms.every(t => a.key.includes(t))) || a.key.localeCompare(b.key, "fr"));
    list.textContent = "";
    count.textContent = res.length === entries.length ? `${res.length} notions` : `${res.length} notion${res.length > 1 ? "s" : ""} sur ${entries.length}`;
    if (!res.length) { list.append(el("p", {class:"lx-empty"}, "Aucune notion trouvée. Elle n'est peut-être pas encore dans une fiche : regarde dans les cours du Drive.")); return; }
    const groups = terms.length ? [["", res]] : [...new Set(res.map(e => e.key[0].toUpperCase()))].map(L => [L, res.filter(e => e.key[0].toUpperCase() === L)]);
    for (const [L, es] of groups) {
      const g = el("div", {class:"lx-group" + (L ? "" : " flat")});
      if (L) g.append(el("div", {class:"lx-letter", "aria-hidden":"true"}, L));
      g.append(el("dl", {class:"lx-dl"}, es.map(e => el("div", {class:"lx-item", style:`--c:var(--${e.m})`},
        el("dt", {}, hl(e.t, terms)),
        el("dd", {},
          el("p", {class:"lx-def"}, hl(e.d, terms)),
          e.note ? el("p", {class:"lx-note"}, e.note) : null,
          el("p", {class:"lx-src"}, el("span", {class:"dot"}), SUBJ[e.m].short, " · ",
            e.s.flatMap((n, i) => { const v = volOf(e.m, n); return [i ? ", " : "", v ? el("a", {href:DOC(v.id), target:"_blank", rel:"noopener"}, "Fiche " + v.code + " " + v.n + " ↗") : "Fiche " + n]; })))))));
      list.append(g);
    }
  };
  let t; input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 80); });
  input.addEventListener("keydown", e => { if (e.key === "Escape" && input.value) { input.value = ""; render(); } });
  const slash = e => { if (e.key === "/" && document.activeElement !== input && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) { e.preventDefault(); input.focus(); } };
  document.addEventListener("keydown", slash);
  lxCleanup = () => document.removeEventListener("keydown", slash);
  renderFilt(); render();
  return () => { if (!MOTION) return; G.from($(".shero .band", root), {scaleX:0, duration:1.1, ease:"expo.inOut"}); G.from($(".shero h1", root), {yPercent:30, duration:1.2, ease:"expo.out"}); G.from($(".lx-bar", root), {y:30, duration:1, ease:"power3.out", delay:.2}); };
}
let lxCleanup = null;

/* ---------- Routeur avec transition ---------- */
const view = $("#view");
let ctx = null, mmCtx = null, first = true;
function routeKey(){ const h = location.hash.replace("#", ""); return ORDER.includes(h) || ["seance", "notes", "lexique"].includes(h) ? h : "accueil"; }
function build(k){
  if (ctx) { ctx.revert(); ctx = null; } if (mmCtx) { mmCtx.revert(); mmCtx = null; }
  if (ST) ST.getAll().forEach(t => t.kill());
  live.forEach(s => s.dispose()); live = [];
  clearInterval(tick); tick = null;
  if (lxCleanup) { lxCleanup(); lxCleanup = null; }
  view.textContent = ""; view.removeAttribute("style");
  const animate = (() => { const a = k === "accueil" ? viewHome(view) : k === "seance" ? viewSeance(view) : k === "notes" ? viewNotes(view) : k === "lexique" ? viewLexique(view) : viewSubject(view, k); fitType(view); return a; })();
  $$("#links a").forEach(a => a.getAttribute("data-r") === k ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const onSpe = SPE.includes(k);
  speBtn.classList.toggle("on", onSpe); speBtn.style.setProperty("--c", onSpe ? `var(--${k})` : "var(--ink)");
  $$("#spe-menu a").forEach(a => a.getAttribute("data-r") === k ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  openSpe(false); markTabs(k); openSheet(false);
  const cur = $(`#links a[data-r="${k}"]`) || (onSpe ? speBtn : null); if (cur) cur.scrollIntoView({block:"nearest", inline:"center"});
  document.title = k === "accueil" ? "Terminale D" : (k === "seance" ? "Séance" : k === "notes" ? "Mes notes" : k === "lexique" ? "Lexique" : SUBJ[k].short) + " · Terminale D";
  if (MOTION) { ctx = G.context(() => { const r = animate(); if (r && r.revert) mmCtx = r; }); requestAnimationFrame(() => ST.refresh()); }
  else animate();
}
function go(){
  const k = routeKey();
  if (first || !MOTION) { first = false; build(k); window.scrollTo(0, 0); return; }
  const c = $("#curtain"), label = $("#curtain-t");
  c.style.setProperty("--c", k === "accueil" || k === "seance" || k === "notes" || k === "lexique" ? "var(--ink)" : `var(--${k})`);
  label.textContent = k === "accueil" ? "Terminale D" : k === "seance" ? "Séance" : k === "notes" ? "Mes notes" : k === "lexique" ? "Lexique" : SUBJ[k].big;
  G.timeline()
    .set(c, {transformOrigin:"bottom"})
    .to(c, {scaleY:1, duration:.55, ease:"expo.inOut"})
    .to(label, {opacity:1, duration:.2}, "-=.15")
    .add(() => { build(k); window.scrollTo(0, 0); view.focus({preventScroll:true}); })
    .set(c, {transformOrigin:"top"})
    .to(label, {opacity:0, duration:.2}, "+=.15")
    .to(c, {scaleY:0, duration:.65, ease:"expo.inOut"}, "-=.05");
}
addEventListener("hashchange", go);
go();
addEventListener("load", () => ST && ST.refresh());
document.fonts?.ready.then(() => { fitType(); if (ST) ST.refresh(); });
</script>
</body>
